[package]
name = "bloodflow-mahjong-belief-dataset"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Belief residual dataset generator for the Rust planner"
rust-version = "1.85"
publish = false

[[bin]]
name = "belief-dataset"
path = "src/main.rs"

[dependencies]
bloodflow-mahjong = { path = "../../core", features = ["belief-training"] }
clap.workspace = true
rand = "0.9"
rand_chacha = "0.9"
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
