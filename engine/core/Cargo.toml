[package]
name = "bloodflow-mahjong"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "High-performance deterministic Blood Flow Mahjong rules engine"
rust-version = "1.85"

[lib]
name = "bloodflow_mahjong"
path = "src/lib.rs"

[[bin]]
name = "throughput-benchmark"
path = "benchmarks/throughput.rs"

[[bin]]
name = "batch-throughput-benchmark"
path = "benchmarks/batch_throughput.rs"

[[bin]]
name = "max-wait-benchmark"
path = "benchmarks/max_wait_benchmark.rs"

[[bin]]
name = "ffi-throughput-benchmark"
path = "benchmarks/ffi_throughput.rs"

[[example]]
name = "rule_nn_smoke"
path = "examples/rule_nn_smoke.rs"
required-features = ["rule-nn"]

[features]
planner-analysis = []
rule-nn = ["dep:tract-onnx", "dep:getrandom"]

[dependencies]
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9", default-features = false, features = ["std"] }
rayon = "1.11"
thiserror = "2"
tract-onnx = { version = "0.23.4", optional = true, default-features = false, features = ["getrandom-js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", optional = true, features = ["wasm_js"] }
