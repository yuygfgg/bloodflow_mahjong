[package]
name = "bloodflow-mahjong-pybind"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "High-performance Python bindings for the Blood Flow Mahjong rules engine"
rust-version = "1.85"
publish = false

[lib]
name = "bloodflow_mahjong"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
bloodflow-mahjong = { path = "../core" }
numpy = "0.27"
pyo3 = { version = "0.27", features = ["abi3-py310"] }

