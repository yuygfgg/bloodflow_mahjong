[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bloodflow-mahjong"
version = "0.1.0"
description = "High-performance Python bindings for the Blood Flow Mahjong rules engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.maturin]
features = ["extension-module"]
module-name = "bloodflow_mahjong"

[tool.pytest.ini_options]
testpaths = ["tests"]

