[package]
name = "bloodflow-mahjong-model-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CPU Candle runtime for learned Blood Flow Mahjong belief models"
rust-version = "1.85"
publish = false

[[bin]]
name = "belief-model-check"
path = "src/bin/check.rs"

[dependencies]
bloodflow-mahjong = { path = "../core" }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
